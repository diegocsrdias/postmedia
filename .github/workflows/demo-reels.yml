# Gera um vídeo de demonstração do app real e publica como Reels/Story.
#
# Dois gatilhos:
#   • workflow_dispatch    — disparo MANUAL, pra você validar (não publica sem marcar).
#   • repository_dispatch  — disparo AUTOMÁTICO do agendador (postmedia/run-scheduler),
#     event_type 'schedule-reel'. Sempre publica e faz callback pra fechar o job.
#
# Segredos necessários (Settings -> Secrets and variables -> Actions):
#   DINDIN_DEMO_URL, DINDIN_DEMO_EMAIL, DINDIN_DEMO_PASSWORD, POSTMEDIA_BASE_URL
#   CRON_SECRET  (mesmo valor do CRON_SECRET no Vercel — autentica o callback)

name: demo-reels

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Fluxo (ex.: quick-add, meta, auto)'
        required: true
        default: 'quick-add'
      targets:
        description: 'Onde publicar (reels, story ou reels,story)'
        required: true
        default: 'reels'
      publish:
        description: 'Publicar de verdade?'
        type: boolean
        default: false
  repository_dispatch:
    types: [schedule-reel]

jobs:
  render:
    runs-on: ubuntu-latest
    # Valores efetivos: vêm do client_payload (agendador) ou dos inputs (manual).
    env:
      FLOW: ${{ github.event.client_payload.flow || github.event.inputs.flow || 'scan-nota' }}
      TARGETS: ${{ github.event.client_payload.targets || github.event.inputs.targets || 'reels' }}
      CLIENT: ${{ github.event.client_payload.client || 'dindin' }}
      JOB_ID: ${{ github.event.client_payload.job_id || '' }}
      CALLBACK: ${{ github.event.client_payload.callback || '' }}
      # Automático sempre publica; manual só quando você marca a caixa.
      DO_PUBLISH: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do worker
        working-directory: worker
        run: npm install

      - name: Instalar Chromium do Playwright
        working-directory: worker
        run: npx playwright install --with-deps chromium

      # A fonte usada nas legendas (compose.mjs → /usr/share/fonts/.../DejaVuSans-Bold.ttf).
      - name: Garantir fonte das legendas
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Gerar (e opcionalmente publicar) o vídeo
        working-directory: worker
        env:
          DINDIN_DEMO_URL: ${{ secrets.DINDIN_DEMO_URL }}
          DINDIN_DEMO_EMAIL: ${{ secrets.DINDIN_DEMO_EMAIL }}
          DINDIN_DEMO_PASSWORD: ${{ secrets.DINDIN_DEMO_PASSWORD }}
          POSTMEDIA_BASE_URL: ${{ secrets.POSTMEDIA_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ARGS=(--flow "$FLOW" --targets "$TARGETS" --client "$CLIENT")
          if [ -n "$JOB_ID" ]; then ARGS+=(--job-id "$JOB_ID"); fi
          if [ -n "$CALLBACK" ]; then ARGS+=(--callback "$CALLBACK"); fi
          if [ "$DO_PUBLISH" = "true" ]; then ARGS+=(--publish); fi
          node record-demo.mjs "${ARGS[@]}"

      - name: Guardar o vídeo como artefato (pra você conferir antes de postar)
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ env.FLOW }}
          path: worker/out/*.mp4
          if-no-files-found: warn
